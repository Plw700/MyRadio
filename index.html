<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Радио</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e8dcc8; /* бежевый фон */
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 16px;
  }
  .player {
    width: 100%;
    max-width: 320px;
    background: #faf3e8; /* светлый бежевый */
    border-radius: 20px;
    padding: 24px 20px 20px;
    box-shadow: 0 6px 20px rgba(80, 50, 20, 0.15);
    text-align: center;
    border: 1px solid #d4c4a8;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #5c4033; /* тёмно-коричневый */
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .sub {
    font-size: 0.75rem;
    color: #8b7355;
    margin-bottom: 20px;
  }
  .stations {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .station {
    padding: 12px 14px;
    border: 1px solid #c9b89a;
    border-radius: 12px;
    background: #f5ede0;
    color: #5c4033;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-align: left;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .station:active {
    background: #e8dcc8;
  }
  .station.active {
    background: #8b6f47; /* коричневый акцент */
    border-color: #6b5335;
    color: #faf3e8;
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }
  .play-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: #8b6f47;
    color: #faf3e8;
    font-size: 1.6rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(80, 50, 20, 0.25);
    -webkit-appearance: none;
    transition: background 0.15s, transform 0.1s;
  }
  .play-btn:active {
    transform: scale(0.95);
    background: #6b5335;
  }
  .play-btn:disabled {
    opacity: 0.5;
  }
  .status {
    font-size: 0.75rem;
    color: #8b7355;
    margin-top: 14px;
    min-height: 1.4em;
    line-height: 1.3;
  }
  audio { display: none; }
</style>
</head>
<body>

<div class="player">
  <h1>Моё радио</h1>
  <div class="sub">Мои станции</div>

  <div class="stations" id="stations"></div>

  <div class="controls">
    <button class="play-btn" id="playBtn" aria-label="Включить">▶</button>
  </div>

  <div class="status" id="status">Готово</div>

  <audio id="audio" preload="none"></audio>
</div>

<script>
(function () {
  // === ЗАМЕНИ ССЫЛКИ НА СВОИ ===
  // Формат: MP3 или AAC. Для старых Safari не используй Ogg/Opus.
  var stations = [
    { name: "Одесское радио", url: "https://myradio24.org/odesradio" },
    { name: "Радио ВИА", url: "https://srv01.gpmradio.ru/stream/pro/aac/64/36?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJrZXkiOiIyYzU5MGIxNzcwN2E3ZDBhZTE4MjZlMWIyZTgzMmQ3ZCIsIklQIjoiMTA5LjExMC43MC4xMjUiLCJVQSI6Ik1vemlsbGEvNS4wIChXaW5kb3dzIE5UIDEwLjA7IFdpbjY0OyB4NjQpIEFwcGxlV2ViS2l0LzUzNy4zNiAoS0hUTUwsIGxpa2UgR2Vja28pIENocm9tZS8xNTUuMC4wLjAgU2FmYXJpLzUzNy4zNiIsIlJlZiI6Imh0dHBzOi8vMTAxLnJ1LyIsInVpZF9jaGFubmVsIjoiMzYiLCJ0eXBlX2NoYW5uZWwiOiJjaGFubmVsIiwidHlwZURldmljZSI6IlBDIiwiQnJvd3NlciI6IkNocm9tZSIsIkJyb3dzZXJWZXJzaW9uIjoiMTU1LjAuMC4wIiwiU3lzdGVtIjoiV2luZG93cyAxMCIsImV4cCI6MTc5MjYzOTE0OH0.j1g5JB_lg2oxsQco_ae-vzuNtQ8pi2W7D-xo6Ogvb7w" },
    { name: "Радио Smooth Jazz", url: "https://srv01.gpmradio.ru/stream/trust/mp3/128/31?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJrZXkiOiIyYzU5MGIxNzcwN2E3ZDBhZTE4MjZlMWIyZTgzMmQ3ZCIsIklQIjoiMTA5LjExMC43MC4xMjUiLCJVQSI6Ik1vemlsbGEvNS4wIChXaW5kb3dzIE5UIDEwLjA7IFdpbjY0OyB4NjQpIEFwcGxlV2ViS2l0LzUzNy4zNiAoS0hUTUwsIGxpa2UgR2Vja28pIENocm9tZS8xNTUuMC4wLjAgU2FmYXJpLzUzNy4zNiIsIlJlZiI6Imh0dHBzOi8vMTAxLnJ1LyIsInVpZF9jaGFubmVsIjoiMzEiLCJ0eXBlX2NoYW5uZWwiOiJjaGFubmVsIiwidHlwZURldmljZSI6IlBDIiwiQnJvd3NlciI6IkNocm9tZSIsIkJyb3dzZXJWZXJzaW9uIjoiMTU1LjAuMC4wIiwiU3lzdGVtIjoiV2luZG93cyAxMCIsImV4cCI6MTc5Mjc0MTg4NX0.cp2aFtivN_sDSoU_XfIc0HbrieHWTCdcpJOXs0zrZRo" }
  ];

  var audio = document.getElementById('audio');
  var playBtn = document.getElementById('playBtn');
  var statusEl = document.getElementById('status');
  var stationsEl = document.getElementById('stations');

  var currentIndex = -1;
  var isPlaying = false;

  // Создаём кнопки станций
  for (var i = 0; i < stations.length; i++) {
    (function (idx) {
      var btn = document.createElement('button');
      btn.className = 'station';
      btn.textContent = stations[idx].name;
      btn.addEventListener('click', function () {
        selectStation(idx);
      });
      stationsEl.appendChild(btn);
    })(i);
  }

  var stationButtons = stationsEl.getElementsByClassName('station');

  function setActiveButton(idx) {
    for (var j = 0; j < stationButtons.length; j++) {
      stationButtons[j].className = 'station' + (j === idx ? ' active' : '');
    }
  }

  function selectStation(idx) {
    if (idx === currentIndex && isPlaying) return;

    currentIndex = idx;
    setActiveButton(idx);

    audio.src = stations[idx].url;
    audio.load();

    // Сбрасываем состояние, но не запускаем автоматически
    isPlaying = false;
    playBtn.textContent = '▶';
    statusEl.textContent = stations[idx].name + ' — нажмите ▶';
  }

  playBtn.addEventListener('click', function () {
    if (currentIndex === -1) {
      // Если станция не выбрана, берём первую
      selectStation(0);
    }

    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
      statusEl.textContent = 'Пауза';
      return;
    }

    // Пробуем воспроизвести
    var playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise.then(function () {
        isPlaying = true;
        playBtn.textContent = '⏸';
        statusEl.textContent = 'Играет: ' + stations[currentIndex].name;
      }).catch(function (err) {
        isPlaying = false;
        playBtn.textContent = '▶';
        statusEl.textContent = 'Ошибка. Проверьте ссылку.';
      });
    } else {
      // Для очень старых браузеров без Promise
      isPlaying = true;
      playBtn.textContent = '⏸';
      statusEl.textContent = 'Играет: ' + stations[currentIndex].name;
    }
  });

  // Обработка ошибок аудио
  audio.addEventListener('error', function () {
    isPlaying = false;
    playBtn.textContent = '▶';
    statusEl.textContent = 'Поток недоступен';
  });

  // Событие паузы (например, из-за прерывания звонком)
  audio.addEventListener('pause', function () {
    if (isPlaying) {
      isPlaying = false;
      playBtn.textContent = '▶';
      statusEl.textContent = 'Пауза';
    }
  });
})();
</script>

</body>
</html>
